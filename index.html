const localGlossary={
'เชียงใหม่–เชียงดาว':'Chiang Mai – Chiang Dao','นครปฐม–สุพรรณบุรี':'Nakhon Pathom – Suphan Buri',

function rawEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function translateOne(i){let v=window.translationSourceTexts?.[i];if(!v)return;let field=$('tr-'+i);if(!field)return;field.placeholder='Translating…';try{let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(v.slice(0,450))+'&langpair=th|en';let response=await fetch(url);if(!response.ok)throw Error('Service unavailable');let j=await response.json();let result=j.responseData?.translatedText;if(!result||/MYMEMORY WARNING/i.test(result))throw Error('No translation');field.value=result}catch(e){alert(appLang==='en'?'Online translation unavailable. Enter a translation manually.':'บริการแปลออนไลน์ไม่พร้อมใช้งาน กรุณาพิมพ์คำแปลเอง')}finally{field.placeholder='English translation'}}

const defaultCover=t=>t.name.includes('เชียงใหม่')?'https://images.unsplash.com/photo-1598935898639-81586f7d2129?w=1100&q=75':'https://images.unsplash.com/photo-1528181304800-259b08848526?w=1100&q=75';
function cover(t){return t.cover||defaultCover(t)}
function renderHome(){let cards=db.trips.map(t=>`<article class="card tripcard"><div class="tripcover"><img src="${esc(cover(t))}" alt="ภาพปกทริป" onerror="this.style.display='none'"><div class="overlay"></div><div class="coverlabel">✦ YOUR NEXT JOURNEY</div></div><div class="tripcardbody"><div class="row between"><div class="grow"><div class="triptitle">${viewText(t.name)}</div><div class="muted">${esc(t.start)}${t.start===t.end?'':' → '+esc(t.end)}</div><div class="pill">${t.days.reduce((n,d)=>n+d.stops.length,0)} จุด • ${t.days.length} วัน ${t.finished?'• จบทริปแล้ว':''}</div></div><button onclick="chooseTrip('${t.id}')">เปิดทริป</button></div><details class="tripactions"><summary>จัดการทริป <span aria-hidden="true">⌄</span></summary><div class="buttons"><button class="secondary tiny" onclick="editTrip('${t.id}')">แก้ไข</button><button class="secondary tiny" onclick="setCover('${t.id}')">เปลี่ยนรูปปก</button><button class="secondary tiny" onclick="duplicateTrip('${t.id}')">คัดลอก</button><button class="secondary tiny" onclick="chooseSummary('${t.id}')">สรุปทริป</button><button class="danger tiny" onclick="deleteTrip('${t.id}')">ลบ</button></div></details></div></article>`).join('');$('main').innerHTML=`<div class="row between"><div><div class="subtle">EXPLORE YOUR WORLD</div><h2>ทริปของฉัน</h2></div><button onclick="editTrip()"><span data-icon="plus"></span> ทริปใหม่</button></div>${cards}<div class="note"></div>`}
function setCover(id){modal(`<h2><span data-icon="camera"></span> รูปปกทริป</h2><p class="muted">เลือกรูปจากโทรศัพท์ ระบบจะย่อรูปก่อนบันทึกไว้ในเครื่อง</p><input type="file" id="coverfile" accept="image/*" onchange="saveCover('${id}',event)"><div class="buttons"><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`)}
function saveCover(id,event){let file=event.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,1000/img.width);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let t=db.trips.find(t=>t.id===id);t.cover=canvas.toDataURL('image/jpeg',.65);save();closeModal();render()};img.src=reader.result};reader.readAsDataURL(file)}
function chooseSummary(id){db.active=id;day=0;save();go('summary')}
function editTrip(id){let t=db.trips.find(x=>x.id===id);modal(`<h2>${t?'แก้ไขทริป':'สร้างทริปใหม่'}</h2><label class="field">ชื่อทริป</label><input id="tname" value="${esc(t?.name||'')}"><label class="field">วันเริ่มต้น</label><input type="date" id="tstart" value="${esc(t?.start||'2026-11-20')}"><label class="field">วันสิ้นสุด</label><input type="date" id="tend" value="${esc(t?.end||'2026-11-20')}"><div class="buttons"><button onclick="saveTrip('${id||''}')">บันทึก</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`)}
function saveTrip(id){let name=$('tname').value.trim(),start=$('tstart').value,end=$('tend').value;if(!name||!start||!end||end<start){alert('กรอกชื่อและช่วงวันที่ให้ถูกต้อง');return}let dates=[],d=new Date(start+'T12:00:00'),last=new Date(end+'T12:00:00');while(d<=last&&dates.length<31){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}if(dates.length===31&&d<=last){alert('รองรับทริปไม่เกิน 31 วัน');return}if(id){let t=db.trips.find(x=>x.id===id);t.name=name;t.start=start;t.end=end;t.days=dates.map(date=>t.days.find(x=>x.date===date)||{date,stops:[]})}else{let id=uid();db.trips.push({id,name,start,end,days:dates.map(date=>({date,stops:[]}))});db.active=id;day=0}save();closeModal();render()}
function duplicateTrip(id){let t=JSON.parse(JSON.stringify(db.trips.find(x=>x.id===id)));t.id=uid();t.name+=' (สำเนา)';db.trips.push(t);save();render()}
function deleteTrip(id){if(!confirm('ลบทริปนี้และรายจ่ายทั้งหมดอย่างถาวร?'))return;db.trips=db.trips.filter(t=>t.id!==id);if(!db.trips.length){db.trips.push({id:uid(),name:'ทริปใหม่',start:'2026-11-20',end:'2026-11-20',days:[{date:'2026-11-20',stops:[]}]})}db.active=db.trips[0].id;day=0;save();render()}
function daytabs(){return `<div class="tabs">${trip().days.map((d,i)=>`<button class="${i===day?'active':''}" onclick="setDay(${i})">วันที่ ${i+1}<br>${esc(d.date.slice(5))}</button>`).join('')}</div>`}
function renderTrip(){let t=trip(),d=curday();$('main').innerHTML=`<div class="row between"><div><div class="subtle">YOUR ITINERARY</div><h2>${viewText(t.name)}</h2><div class="muted">${esc(t.start)} → ${esc(t.end)}</div></div><button class="secondary tiny" onclick="go('home')">ทริปอื่น</button></div>${daytabs()}<div class="odobar row between"><span><span data-icon="car-front"></span> เลขไมล์รถเริ่ม–จบ</span><button class="secondary tiny" onclick="go('summary')">กรอก / ดูระยะทาง →</button></div><div class="totalbar row between"><span><span data-icon="credit-card"></span> รายจ่ายวันนี้</span><strong>${money(d.stops.reduce((a,s)=>a+sum(s),0))}</strong></div><div class="row between"><h3><span data-icon="map-pin"></span> ${esc(d.date)}</h3><button onclick="chooseInsert()"><span data-icon="plus"></span> เพิ่มจุด</button></div>${d.stops.length?d.stops.map((s,i)=>`<article class="card stopcard ${s.status==='done'?'done':''}"><div class="stopflex"><div class="stopdetails"><div class="row"><div class="time">${esc(s.time)}</div><div class="grow"><div class="stopname"><strong>${viewText(s.name)}</strong></div><div class="muted">${viewText(s.note||s.range||'')}</div></div></div><div style="margin-top:10px"><span class="pill">${s.status==='done'?'<span data-icon="check-circle"></span> ไปแล้ว':s.status==='skip'?'ข้าม':'รอไป'} • ${money(sum(s))}</span></div><div class="buttons"><button class="tiny btn-nav" onclick="navigateStop('${s.id}')"><span data-icon="navigation"></span> นำทาง</button><button class="tiny btn-exp" onclick="expenseEditor('${s.id}')"><span data-icon="receipt"></span> รายจ่าย</button><button class="tiny btn-go" onclick="statusStop('${s.id}',sstatus('${s.id}'))">${s.status==='done'?'<span data-icon="rotate-ccw"></span> ย้อนสถานะ':'<span data-icon="check-circle"></span> ไปแล้ว'}</button></div></div><div class="stopvisual"><button class="phototap" aria-label="แตะเพื่อเปลี่ยนรูปสถานที่ ${viewText(s.name)}" title="แตะเพื่อเปลี่ยนรูป" onclick="setStopPhoto('${s.id}')">${s.photo?`<img class="locationthumb" src="${esc(s.photo)}" alt="ภาพสถานที่" onerror="this.style.display='none'">`:`<div class="photofallback"><span data-icon="image"></span><span>แตะเพื่อเพิ่มรูป</span></div>`}</button>${s.photoCredit?`<a class="creditlink" href="${esc(s.photoCredit)}" target="_blank" rel="noopener">ที่มารูป ↗</a>`:""}</div></div><details class="menuarea"><summary>จัดการจุดแวะ</summary><div class="buttons"><button class="secondary tiny" onclick="moveStop('${s.id}',-1)">▲</button><button class="secondary tiny" onclick="moveStop('${s.id}',1)">▼</button><button class="secondary tiny" onclick="editStop('${s.id}')">แก้ไข</button><button class="secondary tiny" onclick="chooseInsert(${i})">แทรกก่อน</button><button class="secondary tiny" onclick="chooseInsert(${i+1})">แทรกหลัง</button><button class="secondary tiny" onclick="statusStop('${s.id}','skip')">ข้าม</button><button class="danger tiny" onclick="deleteStop('${s.id}')">ลบ</button></div></details></article>`).join(''):'<div class="card muted">ยังไม่มีสถานที่ กด + เพิ่มจุด</div>'}<button class="secondary" style="width:100%;margin:12px 0" onclick="go('summary')">ดูสรุปทริปและระยะทาง →</button>`}
function chooseInsert(at){let n=curday().stops.length;modal(`<h2>เพิ่มจุดแวะ</h2><p class="muted">เลือกตำแหน่งของสถานที่ใหม่</p><label class="field">ตำแหน่งในแผนวันนี้</label><select id="insertPosition">${Array.from({length:n+1},(_,i)=>`<option value="${i}" ${i===(at??n)?'selected':''}>${i===0?'บนสุด (ก่อนจุดแรก)':i===n?'ท้ายสุด':`หลังจุดที่ ${i} — ${esc(curday().stops[i-1].name)}`}</option>`).join('')}</select><div class="buttons"><button onclick="insertStop(Number($('insertPosition').value))">ถัดไป →</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`)}
function setStopPhoto(id){let s=findStop(id);modal(`<h2>ภาพสถานที่</h2><div class="muted">${viewText(s.name)}</div><div class="buttons"><button onclick="searchCommons('${id}')"><span data-icon="search"></span> ค้นหารูปฟรีอัตโนมัติ</button><button class="secondary" onclick="navigateStop('${id}')">↗ ดูรูปใน Google Maps</button></div><div id="commonsResults" class="step" style="margin:10px 0">รูปจาก Wikimedia Commons ต้องตรวจสอบว่าตรงกับสถานที่จริงก่อนเลือก</div><label class="field">หรือเลือกรูปจากเครื่อง</label><input id="stopPhotoFile" type="file" accept="image/*" onchange="saveStopPhotoFile('${id}',event)"><label class="field">หรือใส่ URL รูปภาพ https://</label><input id="stopPhotoUrl" placeholder="https://...jpg" value="${s.photo&&!s.photo.startsWith('data:')?esc(s.photo):''}"><div class="buttons"><button onclick="saveStopPhotoUrl('${id}')">บันทึก URL</button><button class="secondary" onclick="closeModal()">ปิด</button></div>`)}
async function searchCommons(id){let s=findStop(id),el=$('commonsResults');el.textContent='กำลังค้นหา Wikimedia Commons…';try{let q=s.name.replace(/^(ออกจาก|เดินทางกลับ|พักรถ)\s*/,'').trim();let url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=320&format=json&origin=*';let response=await fetch(url);if(!response.ok)throw Error('บริการไม่ตอบสนอง');let data=await response.json();let results=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png|webp)$/i.test(p.title));if(!results.length){el.textContent='ไม่พบรูปที่ตรงกับคำค้น ลองใช้รูปจากโทรศัพท์แทน';return}el.innerHTML='<p>เลือกรูปที่ตรงกับสถานที่จริง (รูปอาจเป็นสถานที่ชื่อคล้ายกัน)</p>'+results.map((p,i)=>{let info=p.imageinfo[0];let title=p.title.replace(/^File:/,'');return `<div class="commonsitem"><img src="${esc(info.thumburl)}" alt="${esc(title)}" loading="lazy"><div class="grow"><div class="step">${esc(title)}</div><button class="tiny" onclick="pickCommons('${id}',${i})">ใช้รูปนี้</button></div></div>`}).join('');window.commonsCandidates=results.map(p=>({url:p.imageinfo[0].thumburl,page:p.imageinfo[0].descriptionurl||'https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title),title:p.title}));}catch(e){el.textContent='ค้นหารูปไม่สำเร็จ ('+e.message+') โปรดเลือกภาพเอง'}}
function pickCommons(id,i){let p=window.commonsCandidates?.[i];if(!p)return;let s=findStop(id);s.photo=p.url;s.photoCredit=p.page;s.photoTitle=p.title;save();closeModal();render()}
function saveStopPhotoUrl(id){let v=$('stopPhotoUrl').value.trim();if(v&&!/^https:\/\//i.test(v))return alert('ใช้ URL https เท่านั้น');findStop(id).photo=v;save();closeModal();render()}
function saveStopPhotoFile(id,event){let f=event.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,850/img.width);c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);findStop(id).photo=c.toDataURL('image/jpeg',.58);save();closeModal();render()};img.src=reader.result};reader.readAsDataURL(f)}
function sstatus(id){return findStop(id).status==='done'?'todo':'done'}
let insertAt=null;
function insertStop(index){insertAt=index;editStop()}
function findStop(id){return trip().days.flatMap(d=>d.stops).find(s=>s.id===id)}
function statusStop(id,status){findStop(id).status=status;save();render()}
function moveStop(id,dir){let arr=curday().stops,i=arr.findIndex(s=>s.id===id),j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}
function moveToTop(id){let arr=curday().stops,i=arr.findIndex(s=>s.id===id);if(i<1)return;arr.unshift(arr.splice(i,1)[0]);save();render()}
function deleteStop(id){if(!confirm('ลบจุดแวะนี้และรายจ่ายทั้งหมด?'))return;curday().stops=curday().stops.filter(s=>s.id!==id);save();render()}
function editStop(id){if(id)insertAt=null;let s=id?findStop(id):null;modal(`<h2>${s?'แก้ไขจุดแวะ':'เพิ่มจุดแวะ'}</h2><label class="field">เวลา</label><input id="stime" type="time" value="${esc(s?.time||'09:00')}"><label class="field">ชื่อสถานที่</label><input id="sname" value="${esc(s?.name||'')}"><label class="field">หมายเหตุ</label><textarea id="snote">${esc(s?.note||'')}</textarea><label class="field">ลิงก์ Google Maps (ไม่บังคับ)</label><input id="smap" value="${esc(s?.map||'')}"><div class="buttons"><button onclick="saveStop('${id||''}')">บันทึก</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`)}
function saveStop(id){let name=$('sname').value.trim(),time=$('stime').value,note=$('snote').value,map=$('smap').value.trim();if(!name||!time){alert('กรอกชื่อและเวลา');return}if(map&&!/^https:\/\/(www\.)?(google\.[a-z.]+|maps\.app\.goo\.gl)\//i.test(map)){alert('กรุณาใช้ลิงก์ Google Maps ที่ขึ้นต้นด้วย https://');return}if(id){Object.assign(findStop(id),{name,time,note,map})}else{curday().stops.splice(insertAt===null?curday().stops.length:insertAt,0,{id:uid(),name,time,note,map,status:'todo',expenses:[]})}insertAt=null;save();closeModal();render()}
function navigateStop(id){let s=findStop(id);let url=s.map||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' ประเทศไทย');window.open(url,'_blank','noopener')}
function renderMap(){let t=trip(),stops=curday().stops;let coords=stops.filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))&&s.lat!==undefined&&s.lng!==undefined);let isEnglish=appLang==='en';let labels={th:{title:'เส้นทาง',day:'เส้นทางวันนี้ใน Google Maps',all:'เปิดเส้นทางทั้งทริป (ช่วงแรก)',sequence:'ลำดับจุดแวะ',none:'ยังไม่มีจุดแวะ',notice:'แผนผังนี้แสดงลำดับจุดแวะ ไม่ใช่แผนที่ถนนหรือระยะทางจริง กด Google Maps เพื่อดูเส้นทางขับรถจริง',missing:'ยังไม่มีพิกัดยืนยัน'},en:{title:'Route',day:'Open today in Google Maps',all:'Open trip route (first segment)',sequence:'Stop order',none:'No stops yet',notice:'This is a stop-order diagram, not a road map or actual distance. Open Google Maps for driving directions.',missing:'No verified coordinates'}}[appLang];let items=stops.map((s,i)=>`<div class="route-step"><div class="route-marker">${i+1}</div><div class="route-step-body"><strong>${esc(s.time)} · ${viewText(s.name)}</strong><div class="subtle">${viewText(s.note||'')}</div></div><button class="tiny secondary" onclick="navigateStop('${s.id}')"><span data-icon="navigation"></span></button></div>`).join('');$('main').innerHTML=`<h2><span data-icon="map"></span> ${labels.title} • ${viewText(t.name)}</h2>${daytabs()}<div class="card"><div class="route-info"><span data-icon="route"></span> ${stops.length} ${isEnglish?'planned stops':'จุดแวะตามแผน'} · ${coords.length} ${isEnglish?'saved coordinates':'จุดมีพิกัดบันทึก'}</div><div class="route-diagram">${items||`<p>${labels.none}</p>`}</div><p class="subtle">${labels.notice}</p><div class="buttons"><button onclick="openDayRoute()"><span data-icon="navigation"></span> ${labels.day}</button><button class="secondary" onclick="openTripMap()">${labels.all}</button></div></div>`}
function openDayRoute(){let ss=curday().stops;if(!ss.length)return alert('ยังไม่มีจุดแวะ');if(ss.length===1)return navigateStop(ss[0].id);let q=ss.slice(0,5).map(s=>s.name+' ประเทศไทย');let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(q[0])+'&destination='+encodeURIComponent(q[q.length-1])+'&waypoints='+q.slice(1,-1).map(encodeURIComponent).join('%7C')+'&travelmode=driving';window.open(url,'_blank','noopener');if(ss.length>5)alert('เปิด 5 จุดแรกก่อน เนื่องจากจำนวนจุดแวะมาก โปรดเปิดส่วนถัดไปแยกช่วง')}
function openTripMap(){let names=allStops().filter(s=>s.name).slice(0,5).map(s=>s.name+' ประเทศไทย');if(!names.length)return alert('ยังไม่มีสถานที่');window.open('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(names[0])+'&destination='+encodeURIComponent(names[names.length-1])+'&waypoints='+names.slice(1,-1).map(encodeURIComponent).join('%7C')+'&travelmode=driving','_blank','noopener');alert('ตัวอย่างนี้เปิดเส้นทาง 5 จุดแรกของทริปก่อน ยังไม่ใช่แผนที่รวมทุกจุด')}
function L(th,en){return appLang==='en'?en:th}
function renderSummary(){let t=trip(),ss=allStops(),spent=ss.reduce((a,s)=>a+sum(s),0),done=ss.filter(s=>s.status==='done').length;let start=Number(t.odoStart),end=Number(t.odoEnd),valid=t.odoStart!==undefined&&t.odoEnd!==undefined&&Number.isFinite(start)&&Number.isFinite(end)&&end>=start;let km=valid?end-start:null;let rows=t.days.map(d=>({date:d.date,total:d.stops.reduce((a,s)=>a+sum(s),0)}));$('main').innerHTML=`<div class="row between"><div><div class="subtle">YOUR TRAVEL JOURNAL</div><h2>Trip Summary</h2></div><button class="secondary tiny" onclick="go('trip')">กลับ Trip</button></div><div class="summaryhero"><h2>${viewText(t.name)}</h2><div>${esc(t.start)} → ${esc(t.end)}</div><div class="pill">${t.finished?'✓ จบทริปแล้ว':'กำลังวางแผน / เดินทาง'}</div></div><div class="statgrid" style="margin-top:12px"><div class="stat"><span class="label">รายจ่ายรวม</span><b>${money(spent)}</b></div><div class="stat"><span class="label">ระยะทางจริง</span><b>${km===null?'—':km.toLocaleString('th-TH')+L(' กม.',' km')}</b></div><div class="stat"><span class="label">สถานที่ที่ไปแล้ว</span><b>${done} / ${ss.length}</b></div><div class="stat"><span class="label">จำนวนวัน</span><b>${t.days.length} ${L('วัน','days')}</b></div></div><div class="card"><h3>🚙 เลขกิโลเมตรรถ</h3><div class="row"><div class="grow"><label class="field">เลขไมล์เริ่มต้น (กม.)</label><input id="odostart" type="number" min="0" step="0.1" value="${esc(t.odoStart??'')}" placeholder="เช่น 45120"></div><div class="grow"><label class="field">เลขไมล์สิ้นสุด (กม.)</label><input id="odoend" type="number" min="0" step="0.1" value="${esc(t.odoEnd??'')}" placeholder="เช่น 45468"></div></div><div class="buttons"><button onclick="saveOdo()">บันทึกเลขไมล์</button></div><div class="subtle">ระยะทางจริง = เลขไมล์สิ้นสุด − เลขไมล์เริ่มต้น ไม่ใช่ระยะทางประมาณจากแผนที่</div></div><div class="card"><h3>💳 รายจ่ายแยกรายวัน</h3>${rows.map(r=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid #eef1f3"><span>${esc(r.date)}</span><strong>${money(r.total)}</strong></div>`).join('')}<div class="divider"></div><div class="row between"><strong>รวมทั้งหมด</strong><strong>${money(spent)}</strong></div></div><div class="card"><h3>${L('รายจ่ายตามจุดแวะ','Expenses by Stop')}</h3>${ss.filter(s=>sum(s)>0).map(s=>`<div class="row between" style="padding:8px 0"><span>${viewText(s.name)}</span><strong>${money(sum(s))}</strong></div>`).join('')||'<span class="muted">ยังไม่มีรายจ่าย</span>'}</div><div class="buttons"><button onclick="finishTrip()">${t.finished?'↶ เปิดทริปเพื่อแก้ไข':'✓ Finish Trip'}</button><button class="secondary" onclick="exportSummary()">↗ ส่งออกสรุป CSV</button></div><p class="note"></p>`}
function saveOdo(){let a=$('odostart').value,b=$('odoend').value;if(a&&b&&Number(b)<Number(a))return alert('เลขไมล์สิ้นสุดต้องไม่น้อยกว่าเลขไมล์เริ่มต้น');let t=trip();if(a)t.odoStart=Number(a);else delete t.odoStart;if(b)t.odoEnd=Number(b);else delete t.odoEnd;save();render()}
function finishTrip(){let t=trip();if(!t.finished&&!confirm('ยืนยันจบทริป? ยังกลับมาแก้ไขข้อมูลได้'))return;t.finished=!t.finished;save();render()}
function exportSummary(){let t=trip(),lines=[['วันที่','เวลา','สถานที่','รายการ','วิธีบันทึก','จำนวนเงิน']];for(let d of t.days)for(let s of d.stops)for(let e of s.expenses||[])for(let item of e.items||[])lines.push([d.date,s.time,s.name,item.name,e.source||'ไม่ระบุ',item.amount]);lines.push(['เลขไมล์เริ่มต้น',t.odoStart??'']);lines.push(['เลขไมล์สิ้นสุด',t.odoEnd??'']);let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trip-summary.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function renderExpenses(){let all=allStops(),total=all.reduce((a,s)=>a+sum(s),0);let lines=all.flatMap(s=>(s.expenses||[]).map(e=>({...e,stop:s.name,date:s.date,stopId:s.id})));$('main').innerHTML=`<h2><span data-icon="wallet"></span> รายจ่าย • ${viewText(trip().name)}</h2><button class="secondary" onclick="go('summary')">สรุปทั้งทริป / เลขไมล์รถ →</button><div class="totalbar"><div>ยอดรวมทั้งทริป</div><div class="amount">${money(total)}</div><div>${lines.length} ใบเสร็จ / บันทึก</div></div>${trip().days.map(d=>`<div class="card row between"><span>${esc(d.date)}</span><strong>${money(d.stops.reduce((a,s)=>a+sum(s),0))}</strong></div>`).join('')}<h3>ประวัติรายจ่าย</h3>${lines.length?lines.map(e=>`<div class="card"><div class="row between"><strong>${viewText(e.store||e.stop)}</strong><strong>${money(e.total)}</strong></div><div class="muted">${esc(e.date)} • ${viewText(e.stop)} • ${e.source==='scan'?'📷 สแกน':'<span data-icon="pencil"></span> พิมพ์เอง'}</div><div class="step">${(e.items||[]).map(x=>viewText(x.name)+' '+money(x.amount)).join(' • ')}</div><div class="buttons"><button class="secondary tiny" onclick="viewExpense('${e.stopId}','${e.id}')">ดู / แก้ไข</button><button class="danger tiny" onclick="deleteExpense('${e.stopId}','${e.id}')">ลบ</button></div></div>`).join(''):'<div class="card muted">ยังไม่มีรายจ่าย เพิ่มได้จากรายการแต่ละช่วงเวลาในหน้า Trip</div>'}`}
function deleteExpense(sid,eid){if(!confirm('ลบรายการรายจ่ายนี้?'))return;let s=findStop(sid);s.expenses=s.expenses.filter(e=>e.id!==eid);save();render()}
function viewExpense(sid,eid){expenseEditor(sid,eid)}
function expenseEditor(sid,eid,mode){receiptStopId=sid;let e=eid?findStop(sid).expenses.find(x=>x.id===eid):null;if(!e&&!mode){modal(`<h2>＋ เพิ่มรายจ่าย</h2><div class="muted">${esc(findStop(sid).name)}</div><p>เลือกวิธีบันทึกรายจ่าย</p><div class="buttons"><button onclick="expenseEditor('${sid}','','manual')"><span data-icon="pencil"></span> พิมพ์เอง</button><button onclick="expenseEditor('${sid}','','scan')"><span data-icon="scan-line"></span> สแกนใบเสร็จ</button></div><p class="note">ทั้งสองวิธีจะบันทึกลงในรายการรายจ่ายเดียวกัน และรวมยอดอัตโนมัติ</p><button class="secondary" onclick="closeModal()">ยกเลิก</button>`);return}expenseMode=e?.source||mode||'manual';receiptLines=e?JSON.parse(JSON.stringify(e.items)):[{name:'',amount:''}];receiptImage=null;let scan=expenseMode==='scan';modal(`<h2>${scan?'<span data-icon="scan-line"></span> สแกนใบเสร็จ':'<span data-icon="pencil"></span> พิมพ์รายจ่าย'}</h2><div class="muted">${esc(findStop(sid).name)}</div><label class="field">${scan?'ชื่อร้าน / ใบเสร็จ (ไม่บังคับ)':'หมายเหตุ / ชื่อร้าน (ไม่บังคับ)'}</label><input id="store" value="${esc(e?.store||'')}" placeholder="เช่น ทำบุญ / ร้านกาแฟ">${scan?`<label class="field">ถ่ายรูปหรือเลือกรูปใบเสร็จ</label><input id="receiptfile" type="file" accept="image/*" capture="environment" onchange="imageSelected(event)"><div id="preview"></div><div class="buttons"><button class="secondary" id="ocrbtn" onclick="scanReceipt()">🔎 อ่านรายการจากรูป (OCR)</button></div><div id="ocrstatus" class="step">อ่านรายการอัตโนมัติผ่านอินเทอร์เน็ต โปรดตรวจสอบและแก้ไขผล OCR ก่อนบันทึก</div>`:''}<h3 style="margin-top:16px">${scan?'รายการจากใบเสร็จ':'รายการที่จ่าย'}</h3><div id="lines"></div><button class="secondary tiny" onclick="addLine()">＋ เพิ่มรายการ</button><div class="divider"></div><div class="row between"><strong>ยอดรวมอัตโนมัติ</strong><strong id="receiptTotal" class="amount">฿0</strong></div><div class="buttons"><button onclick="saveExpense('${eid||''}')">✓ ยืนยันและบันทึก</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`);renderLines()}
function renderLines(){let el=$('lines');if(!el)return;el.innerHTML=receiptLines.map((r,i)=>`<div class="receiptrow"><input aria-label="ชื่อรายการ" placeholder="ชื่อสินค้า / อาหาร" value="${esc(r.name)}" oninput="setLine(${i},'name',this.value)"><input aria-label="ราคา" type="number" min="0" step=".01" placeholder="บาท" value="${esc(r.amount)}" oninput="setLine(${i},'amount',this.value)"><button class="danger tiny" onclick="removeLine(${i})">×</button></div>`).join('');updateTotal()}
function setLine(i,k,v){receiptLines[i][k]=v;updateTotal()}
function updateTotal(){let n=receiptLines.reduce((a,r)=>a+(Number(r.amount)||0),0);if($('receiptTotal'))$('receiptTotal').textContent=money(n)}
function addLine(){receiptLines.push({name:'',amount:''});renderLines()}
function removeLine(i){receiptLines.splice(i,1);if(!receiptLines.length)receiptLines=[{name:'',amount:''}];renderLines()}
function imageSelected(event){let file=event.target.files?.[0];if(!file)return;receiptImage=file;let url=URL.createObjectURL(file);$('preview').innerHTML=`<img class="thumb" src="${url}" alt="ภาพใบเสร็จ">`}
function parseReceiptText(text){let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),out=[];for(let line of lines){let m=line.match(/^(.{2,}?)\s+(\d{1,6}(?:[,.]\d{2})?)\s*(?:฿|บาท)?$/);if(!m)continue;let name=m[1].trim(),n=Number(m[2].replace(/,/g,''));if(!n||/total|subtotal|change|cash|vat|tax|รวม|เงินทอน|ชำระ|ยอดสุทธิ|ภาษี|ส่วนลด/i.test(name))continue;out.push({name,amount:n})}return out}
async function scanReceipt(){if(!receiptImage)return alert('กรุณาถ่ายรูปหรือเลือกรูปใบเสร็จก่อน');if(ocrBusy)return;ocrBusy=true;$('ocrbtn').disabled=true;$('ocrstatus').textContent='กำลังเตรียมระบบ OCR ผ่านอินเทอร์เน็ต…';try{if(!window.Tesseract){await new Promise((res,rej)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('โหลดระบบ OCR ไม่สำเร็จ'));document.head.appendChild(sc)})}let result=await Tesseract.recognize(receiptImage,'tha+eng',{logger:m=>{if($('ocrstatus')&&m.status==='recognizing text')$('ocrstatus').textContent='กำลังอ่านข้อความ '+Math.round((m.progress||0)*100)+'%'}});let found=parseReceiptText(result.data.text);if(found.length){receiptLines=found;renderLines();$('ocrstatus').textContent='อ่านได้ '+found.length+' รายการ (ยังไม่ยืนยัน) โปรดตรวจชื่อ ราคา และยอดรวมก่อนบันทึก'}else{$('ocrstatus').textContent='อ่านตัวอักษรได้ แต่ยังแยกรายการอัตโนมัติไม่ได้ กรุณากรอกหรือแก้ไขเอง';alert('ไม่พบรายการราคาที่อ่านได้ชัดเจน กรุณากรอกเอง')} }catch(e){$('ocrstatus').textContent='OCR ไม่พร้อมใช้งาน: '+e.message+' — ยังสามารถพิมพ์รายการเองได้'}finally{ocrBusy=false;if($('ocrbtn'))$('ocrbtn').disabled=false}}
function saveExpense(eid){let store=$('store').value.trim(),items=receiptLines.filter(x=>x.name.trim()&&Number(x.amount)>=0&&x.amount!=='').map(x=>({name:x.name.trim(),amount:Number(x.amount)}));if(!items.length){alert('กรุณากรอกรายการและราคาอย่างน้อย 1 รายการ');return}let total=items.reduce((a,x)=>a+x.amount,0),s=findStop(receiptStopId);s.expenses=s.expenses||[];let e={id:eid||uid(),store,items,total,source:expenseMode,created:new Date().toISOString()};if(eid){let i=s.expenses.findIndex(x=>x.id===eid);s.expenses[i]=e}else{s.expenses.push(e)}save();closeModal();render()}

function translateText(value){
 if(!value||!value.trim())return value;
 const lead=value.match(/^\s*/)[0],tail=value.match(/\s*$/)[0],core=value.trim();
 if(appLang==='th')return value;
 if(thToEn.has(core))return lead+thToEn.get(core)+tail;
 let out=core;
 // Translate UI phrases embedded in headings, buttons and status badges.
 for(const [th,en] of phrasePairs){if(out.includes(th))out=out.split(th).join(en)}
 out=out.replace(/(\d+)\s*จุด/g,'$1 stops').replace(/(\d+)\s*วัน/g,'$1 days').replace(/(\d+)\s*กม\./g,'$1 km');
 return lead+out+tail;
}

function applyLanguage(){if(translating)return;translating=true;document.documentElement.lang=appLang;let sel=document.getElementById('langChoice');if(sel)sel.value=appLang;let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(let n of nodes){if(n.parentElement?.closest('script,style,option,textarea,input,.stopname,.triptitle,.route-step-body,.stop-title,.trip-name,.muted.user-data'))continue;let newText=translateText(n.nodeValue);if(newText!==n.nodeValue)n.nodeValue=newText}translating=false}
function changeLanguage(lang){appLang=lang==='en'?'en':'th';localStorage.setItem('trip_planner_language',appLang);document.querySelector('.headmenu')?.removeAttribute('open');render();applyLanguage()}
const languageObserver=new MutationObserver(()=>{if(!translating)applyLanguage()});languageObserver.observe(document.body,{childList:true,subtree:true,characterData:false});
render();applyLanguage();
</script>
<style id="cloud-v26-style">
.cloud-settings{display:grid;gap:10px}.cloud-status{font-size:13px;color:#52647b;background:#f0f3fa;padding:10px;border-radius:10px}.cloud-settings input{font-size:15px}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.cloud-actions button{flex:1}.cloud-badge{font-size:11px;color:#52647b}
</style>
<script id="cloud-v26">
/* V2.6 authentication bridge. Local trip data remains authoritative until a schema-aware sync is implemented. */
const CLOUD_CFG_KEY='trip_planner_v26_supabase_config';
let cloudClient=null,cloudSession=null;
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'{}')}catch(e){return {}}}
function cloudNotice(message){let el=document.getElementById('cloud-notice');if(el)el.textContent=message}
function cloudDialog(){let c=cloudConfig();modal(`<h2>${L('บัญชีและการเชื่อมต่อ','Account & Connection')}</h2><p class="muted">${L('ข้อมูลทริปในเครื่องจะยังไม่ถูกลบหรืออัปโหลดโดยอัตโนมัติ','Local trips will not be deleted or uploaded automatically')}</p><div class="cloud-settings"><label class="field">Supabase Project URL</label><input id="cloud-url" type="url" placeholder="https://your-project.supabase.co" value="${esc(c.url||'')}"><label class="field">Publishable API key</label><input id="cloud-key" autocomplete="off" placeholder="sb_publishable_..." value="${esc(c.key||'')}"><p class="subtle">${L('ใช้ Publishable key เท่านั้น ห้ามใช้ Secret หรือ service_role key','Use only a publishable key, never a secret or service_role key')}</p><button onclick="cloudSaveConfig()">${L('บันทึกการเชื่อมต่อ','Save connection')}</button><div id="cloud-notice" class="cloud-status">${cloudSession?esc(cloudSession.user.email||'Signed in'):L('ยังไม่ได้เข้าสู่ระบบ','Not signed in')}</div><label class="field">Email</label><input id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com"><label class="field">Password</label><input id="cloud-password" type="password" autocomplete="current-password" placeholder="Password"><div class="cloud-actions"><button onclick="cloudAuth('signUp')">${L('สมัครสมาชิก','Sign up')}</button><button onclick="cloudAuth('signInWithPassword')">${L('เข้าสู่ระบบ','Sign in')}</button><button class="secondary" onclick="cloudSignOut()">${L('ออกจากระบบ','Sign out')}</button></div><button class="secondary" onclick="cloudPasswordReset()">${L('ส่งอีเมลตั้งรหัสผ่านใหม่','Reset password by email')}</button><button class="secondary" onclick="closeModal()">${L('ปิด','Close')}</button></div>`)}
function cloudLibrary(){return new Promise((resolve,reject)=>{if(window.supabase?.createClient)return resolve(window.supabase);let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(Error('Library not loaded'));script.onerror=()=>reject(Error('Cannot load Supabase library. Check internet connection.'));document.head.appendChild(script)})}
async function cloudConnect(){let c=cloudConfig();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(c.url||''))throw Error('Invalid Supabase project URL');if(!/^sb_publishable_|^eyJ/.test(c.key||''))throw Error('Enter a publishable or legacy anon key');let lib=await cloudLibrary();if(!cloudClient)cloudClient=lib.createClient(c.url.replace(/\/$/,''),c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data,error}=await cloudClient.auth.getSession();if(error)throw error;cloudSession=data.session;return cloudClient}
async function cloudSaveConfig(){let url=document.getElementById('cloud-url').value.trim(),key=document.getElementById('cloud-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))return cloudNotice('Invalid project URL');if(!/^sb_publishable_|^eyJ/.test(key))return cloudNotice('Use a publishable key');let old=cloudConfig();if((old.url!==url||old.key!==key)&&cloudClient){await cloudClient.auth.signOut().catch(()=>{});cloudClient=null;cloudSession=null}localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify({url,key}));cloudNotice('Connection saved. You can now sign up or sign in.');try{await cloudConnect();cloudNotice('Connected to Supabase. '+(cloudSession?.user?.email||'Please sign in.'))}catch(e){cloudNotice('Connection issue: '+e.message)}}
async function cloudAuth(method){let email=document.getElementById('cloud-email')?.value.trim(),password=document.getElementById('cloud-password')?.value;if(!email||!password)return cloudNotice('Enter email and password');cloudNotice('Contacting Supabase…');try{let client=await cloudConnect();let {data,error}=await client.auth[method]({email,password,options:method==='signUp'?{emailRedirectTo:location.protocol==='https:'?location.href.split('#')[0]:undefined}:undefined});if(error)throw error;cloudSession=data.session;cloudNotice(cloudSession?'Signed in as '+cloudSession.user.email:'Check your email for the confirmation link, then sign in.')}catch(e){cloudNotice(e.message)}}
async function cloudSignOut(){try{let client=await cloudConnect();let {error}=await client.auth.signOut();if(error)throw error;cloudSession=null;cloudNotice('Signed out. Your local trips are unchanged.')}catch(e){cloudNotice(e.message)}}
async function cloudPasswordReset(){let email=document.getElementById('cloud-email')?.value.trim();if(!email)return cloudNotice('Enter your email first');try{let client=await cloudConnect();let {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.protocol==='https:'?location.href.split('#')[0]:undefined});if(error)throw error;cloudNotice('If the account exists, a reset email will be sent.')}catch(e){cloudNotice(e.message)}}
(function addCloudMenu(){let panel=document.querySelector('.headpanel');if(!panel)return;let b=document.createElement('button');b.className='secondary tiny';b.style.cssText='width:100%;margin-top:8px';b.textContent='☁ '+L('บัญชี / Supabase','Account / Supabase');b.onclick=()=>{document.querySelector('.headmenu')?.removeAttribute('open');cloudDialog()};panel.appendChild(b)})();
</script>
<style id="v27a-style">.sync-preview{border:1px solid #e4e9f1;border-radius:12px;padding:12px;margin:10px 0;background:#fafbfe}.sync-preview label{display:flex;align-items:center;gap:9px;font-weight:650}.sync-preview input[type=checkbox]{width:auto}.sync-preview small{display:block;margin:6px 0 0 26px}.sync-warning{background:#fff4e6;color:#775019;padding:11px;border-radius:10px;font-size:13px}.sync-log{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style>
<script id="cloud-sync-v27a">
const CLOUD_UPLOAD_KEY='trip_planner_v27a_upload_ids';
function syncGetIds(){try{return JSON.parse(localStorage.getItem(CLOUD_UPLOAD_KEY)||'{}')}catch(_){return {}}}
function syncSetIds(x){localStorage.setItem(CLOUD_UPLOAD_KEY,JSON.stringify(x))}
function syncUuid(){if(!globalThis.crypto?.randomUUID)throw Error('This browser requires a secure HTTPS connection for UUID generation.');return crypto.randomUUID()}
function syncId(group,key){if(!group[key]){group[key]=syncUuid();syncSetIds(syncUploadIds)}return group[key]}
let syncUploadIds={};
function syncLog(message){let el=document.getElementById('sync-log');if(el)el.textContent=message}
function syncSafePhoto(url){return typeof url==='string'&&/^https:\/\//i.test(url)?url:null}
function syncDate(iso,fallback){return /^\d{4}-\d{2}-\d{2}/.test(iso||'')?iso.slice(0,10):fallback}
function syncTime(t){return /^([01]\d|2[0-3]):[0-5]\d$/.test(t||'')?t:null}
function syncExpenseDescription(e){let items=(e.items||[]).map(x=>String(x.name||'')+' ('+Number(x.amount||0).toFixed(2)+' THB)').join('; ');return [e.store||'',items,e.source==='scan'?'[receipt scan]':''].filter(Boolean).join(' | ')||'Expense'}
function syncDialog(){let tlist=db.trips.map((t,i)=>{let stops=t.days.reduce((n,d)=>n+d.stops.length,0),expenses=t.days.reduce((n,d)=>n+d.stops.reduce((a,s)=>a+(s.expenses||[]).length,0),0);return `<div class="sync-preview"><label><input type="checkbox" class="sync-select" value="${i}"><span>${viewText(t.name)}</span></label><small>${esc(t.start)} → ${esc(t.end)} · ${t.days.length} ${L('วัน','days')} · ${stops} ${L('จุด','stops')} · ${expenses} ${L('บันทึกรายจ่าย','expense records')}</small></div>`}).join('');modal(`<h2>${L('อัปโหลดทริปไป Supabase','Upload trips to Supabase')}</h2><p class="muted">${L('เลือกทริปที่ต้องการอัปโหลด ระบบจะไม่ลบข้อมูลในเครื่อง และไม่ดาวน์โหลดทับข้อมูลเดิม','Select trips to upload. Local data stays untouched; no automatic cloud download or replacement.')}</p><div class="sync-warning">${L('ก่อนเริ่ม ควรสำรอง JSON ไว้ก่อน รูปภาพที่บันทึกเป็นไฟล์ในเครื่องจะไม่ถูกอัปโหลด และรายละเอียดรายจ่ายแบบหลายรายการจะถูกรวมเป็นข้อความใน Cloud','Back up JSON first. Locally embedded images will not upload. Expense line items are preserved as text in the cloud description.')}</div>${tlist||'<p>No trips</p>'}<div class="buttons"><button class="secondary" onclick="backup()">${L('สำรอง JSON','Back up JSON')}</button><button id="sync-upload-button" onclick="syncUploadSelected()">${L('อัปโหลดทริปที่เลือก','Upload selected trips')}</button><button class="secondary" onclick="closeModal()">${L('ปิด','Close')}</button></div><div id="sync-log" class="sync-log cloud-status" aria-live="polite">${L('รอเลือกทริป','Select a trip to continue')}</div>`)}
async function syncUploadSelected(){let chosen=[...document.querySelectorAll('.sync-select:checked')].map(x=>db.trips[Number(x.value)]).filter(Boolean);if(!chosen.length)return syncLog(L('กรุณาเลือกอย่างน้อย 1 ทริป','Select at least one trip'));if(!confirm(L('ยืนยันอัปโหลด '+chosen.length+' ทริปขึ้น Supabase?','Upload '+chosen.length+' selected trip(s) to Supabase?')))return;let button=document.getElementById('sync-upload-button');button.disabled=true;let success=0;try{let client=await cloudConnect();let {data:authData,error:authError}=await client.auth.getUser();if(authError)throw authError;let user=authData?.user;if(!user)throw Error(L('กรุณาเข้าสู่ระบบก่อน','Sign in first'));let cfg=cloudConfig(),root=cfg.url+'|'+user.id;syncUploadIds=syncGetIds();for(let t of chosen){try{syncLog(L('กำลังอัปโหลด: ','Uploading: ')+t.name);await syncUploadTrip(client,user.id,root,t);success++;syncLog(L('อัปโหลดสำเร็จ ','Uploaded ')+success+'/'+chosen.length+' : '+t.name)}catch(err){syncLog(L('สำเร็จ ','Completed ')+success+'/'+chosen.length+'\n'+L('ผิดพลาดที่ทริป ','Failed on ')+t.name+': '+err.message+'\n'+L('แก้ปัญหาแล้วกดอัปโหลดอีกครั้งได้ โดยใช้รหัส Cloud เดิม','Fix the error and retry; the same cloud IDs will be reused.'));return}}syncLog(L('อัปโหลดสำเร็จครบ ','Upload complete: ')+success+'/'+chosen.length+'\n'+L('ข้อมูลในเครื่องยังอยู่ครบ','Local trips are unchanged.'))}catch(e){syncLog(L('อัปโหลดไม่สำเร็จ: ','Upload failed: ')+e.message)}finally{button.disabled=false}}
async function syncWrite(client,table,rows){if(!rows.length)return;for(let i=0;i<rows.length;i+=100){let {error}=await client.from(table).upsert(rows.slice(i,i+100),{onConflict:'id'});if(error)throw Error(table+': '+error.message)}}
async function syncUploadTrip(client,userId,root,t){let localKey=root+'|'+t.id,ids=syncUploadIds[localKey]||{trip:syncUuid(),days:{},stops:{},expenses:{}};ids.days ||= {};ids.stops ||= {};ids.expenses ||= {};syncUploadIds[localKey]=ids;syncSetIds(syncUploadIds);
// Reject collisions with someone else's trip; do not overwrite remote trips by accident.
let {data:existing,error:readError}=await client.from('trips').select('id,owner_id').eq('id',ids.trip).maybeSingle();if(readError)throw readError;if(existing&&existing.owner_id!==userId)throw Error('Cloud trip is not owned by the current user');
let tr={id:ids.trip,owner_id:userId,title:t.name,description:'',cover_url:syncSafePhoto(t.cover),start_date:syncDate(t.start,null),end_date:syncDate(t.end,null),start_odometer:Number.isFinite(Number(t.odoStart))&&t.odoStart!==undefined?Number(t.odoStart):null,end_odometer:Number.isFinite(Number(t.odoEnd))&&t.odoEnd!==undefined?Number(t.odoEnd):null,status:'planning'};
// Insert new trips explicitly: UPSERT can invoke UPDATE RLS checks even for a new row.
if(existing){
  const {error: tripError}=await client.from('trips').update({
    title:tr.title,description:tr.description,cover_url:tr.cover_url,
    start_date:tr.start_date,end_date:tr.end_date,
    start_odometer:tr.start_odometer,end_odometer:tr.end_odometer,status:tr.status
  }).eq('id',ids.trip);
  if(tripError)throw Error('trips update: '+tripError.message);
}else{
  const {error: tripError}=await client.from('trips').insert(tr);
  if(tripError)throw Error('trips insert: '+tripError.message);
}
let days=[],stops=[],expenses=[];
for(let di=0;di<t.days.length;di++){let d=t.days[di],dayKey=d.date+'|'+di;ids.days[dayKey] ||= syncUuid();let dayId=ids.days[dayKey];days.push({id:dayId,trip_id:ids.trip,day_date:syncDate(d.date,t.start),day_order:di,title:'',notes:''});for(let si=0;si<d.stops.length;si++){let st=d.stops[si],stopKey=d.date+'|'+st.id;ids.stops[stopKey] ||= syncUuid();let stopId=ids.stops[stopKey],lat=st.lat===undefined?null:Number(st.lat),lng=st.lng===undefined?null:Number(st.lng);stops.push({id:stopId,trip_id:ids.trip,day_id:dayId,stop_order:si,name:st.name,planned_time:syncTime(st.time),notes:st.note||st.range||'',latitude:Number.isFinite(lat)?lat:null,longitude:Number.isFinite(lng)?lng:null,photo_url:syncSafePhoto(st.photo),status:'planned'});for(let ei=0;ei<(st.expenses||[]).length;ei++){let e=st.expenses[ei],expKey=stopKey+'|'+(e.id||ei);ids.expenses[expKey] ||= syncUuid();expenses.push({id:ids.expenses[expKey],trip_id:ids.trip,stop_id:stopId,created_by:userId,expense_date:syncDate(e.created,d.date),description:syncExpenseDescription(e),amount:Number(e.total||0),currency:'THB',receipt_url:null})}}}
syncSetIds(syncUploadIds);await syncWrite(client,'trip_days',days);await syncWrite(client,'stops',stops);await syncWrite(client,'expenses',expenses);
}
(function(){let p=document.querySelector('.headpanel');if(p){let b=document.createElement('button');b.className='secondary tiny';b.style.cssText='width:100%;margin-top:8px';b.textContent='☁ '+L('อัปโหลดทริปไป Cloud','Upload trips to Cloud');b.onclick=()=>{document.querySelector('.headmenu')?.removeAttribute('open');syncDialog()};p.appendChild(b)}})();
</script></body></html>
